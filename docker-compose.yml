# Start the device-generator microservice (telemetry producer → Confluent Cloud Kafka).
# Set Kafka and Schema Registry credentials via .env (see producers/device-generator/.env.example).

services:
  device-generator:
    build:
      context: ./producers/device-generator
      dockerfile: Dockerfile
    image: healthcare-shift-left-demo/device-generator:latest
    container_name: device-generator
    ports:
      - "8000:8000"
    env_file:
      - ./producers/device-generator/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-device-metrics}
      - SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL}
      - SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO=${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO}
      - SIMULATION_INTERVAL_SECONDS=${SIMULATION_INTERVAL_SECONDS:-2.0}
      - SIMULATION_NUM_PATIENTS=${SIMULATION_NUM_PATIENTS:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
