# dbt project: Flink SQL is materialized as ephemeral models under models/flink/
# (generated from pipelines/inventory.json). Deploy uses compiled_code from the
# manifest after `dbt compile`.

name: 'flink_pipelines'
version: '1.0.0'
config-version: 2

profile: 'flink_pipelines'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  kafka_retention_time: '0'
  kafka_compression_type: 'snappy'

models:
  flink_pipelines:
    +materialized: ephemeral
    flink:
      +tags: ['flink']
