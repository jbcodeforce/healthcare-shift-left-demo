version: 2

models:
  - name: hc_raw_patients
    description: Raw CDC layer for patient data from Debezium
    meta:
      layer: raw
      deployment_phase: 1
      ddl_path: ../../raw/raw_patients/sql-scripts/ddl.raw_patients.sql
      dml_path: ../../raw/raw_patients/sql-scripts/dml.raw_patients.sql
    columns:
      - name: patient_id
        description: Source primary key from Debezium
      - name: before
        description: Row state before change (JSON)
      - name: after
        description: Row state after change (JSON)
      - name: op
        description: Debezium operation (c=create, u=update, d=delete, r=read)

  - name: hc_raw_devices
    description: Raw CDC layer for device data
    meta:
      layer: raw
      deployment_phase: 1
      ddl_path: ../../raw/raw_devices/sql-scripts/ddl.raw_devices.sql
      dml_path: ../../raw/raw_devices/sql-scripts/dml.raw_devices.sql

  - name: hc_raw_device_metrics
    description: Raw streaming telemetry from devices
    meta:
      layer: raw
      deployment_phase: 1
      ddl_path: ../../raw/raw_device_metrics/sql-scripts/ddl.device_metrics.sql
      dml_path: ../../raw/raw_device_metrics/sql-scripts/dml.device_metrics.sql
