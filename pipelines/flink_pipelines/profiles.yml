# dbt profile for this project. Used for parse/compile/docs only — Flink deploy uses Confluent APIs.
# Override connection via env vars (same defaults as docker-compose Postgres).
flink_pipelines:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'demo') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'demo') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'healthcare') }}"
      schema: dbt_flink_meta
      threads: 1
